[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "ejscreen-data-processing"
version = "3.2024.1"
description = "Data processing for re-creating US EPA's EJSCREEN datasets"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "caffeine>=0.5",
    "dotenv>=0.9.9",
    "geopandas>=1.1.4",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "py7zr>=1.1.3",
    "pyarrow>=25.0.1",
    "pyproj>=3.7.2",
    "requests>=2.34.2",
]
[tool.hatch.build.targets.wheel]
packages = ["scripts"]
